<!DOCTYPE html>
<html lang="en">
<head>

<title>The Star of Merdeka — a museum heist</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #0d0a08;

    display: flex;

    color: #8d8578;
    font-size: 12px;
    text-align: center;
    padding: 6px 0 0;
  }

<body>
<div id="wrap">
  <canvas id="game" width="1280" height="720"></canvas>
  <div id="note">The Star of Merdeka — A/D gerak · W/Spasi lompat · W/S panjat tangga · Shift sneak · E ambil berlian / hack · Q smoke · X stun polisi · F jammer (matikan kamera) · Klik: lempar koin — Loot kecil diambil OTOMATIS saat disentuh</div>
</div>
<script type="module" src="./src/main.js"></script>
